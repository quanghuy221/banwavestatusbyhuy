<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banwave Status & Realtime Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-glow: rgba(52, 211, 153, 0.25);
            --green-glow: #10b981;
            --green-light: #34d399;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.7),
                0 0 40px -10px rgba(16, 185, 129, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform: translateZ(0);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
            animation: cardFloat 6s ease-in-out infinite alternate;
        }

        .dashboard-container:hover {
            transform: translateY(-6px) scale(1.01) translateZ(0);
            box-shadow: 
                0 40px 80px -15px rgba(0, 0, 0, 0.8),
                0 0 50px -5px rgba(16, 185, 129, 0.35);
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px) translateZ(0); }
            100% { transform: translateY(-10px) translateZ(0); }
        }

        .status-card {
            background: rgba(6, 78, 59, 0.25);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 20px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .live-dot-wrapper {
            position: relative;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background: var(--green-light);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--green-light);
            z-index: 2;
        }

        .pulse-ring {
            position: absolute;
            width: 28px;
            height: 28px;
            background: rgba(52, 211, 153, 0.4);
            border-radius: 50%;
            animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
            z-index: 1;
        }

        @keyframes ripple {
            0% { transform: scale(0.4); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .status-text-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            font-weight: 700;
        }

        .status-text-main {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--green-light);
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
        }

        .status-icon-shield {
            font-size: 1.5rem;
            color: var(--green-light);
            filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.6));
            animation: shieldPulse 3s ease-in-out infinite;
        }

        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .clock-section {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 22px;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .clock-header {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .clock-header i { color: #38bdf8; }

        .digital-clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            will-change: content;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 500;
        }

        .api-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .api-card:hover {
            border-color: var(--green-light);
            background: rgba(16, 185, 129, 0.05);
        }

        .api-title {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .api-status-val {
            font-size: 0.88rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="dashboard-container">
        
        <!-- BANWAVE STATUS -->
        <div class="status-card">
            <div class="status-left">
                <div class="live-dot-wrapper">
                    <div class="pulse-ring"></div>
                    <div class="live-dot"></div>
                </div>
                <div>
                    <div class="status-text-title">Hệ thống bảo vệ</div>
                    <div class="status-text-main" id="banwaveStatusText">BANWAVE STATUS: 🟢</div>
                </div>
            </div>
            <i class="fa-solid fa-shield-halved status-icon-shield"></i>
        </div>

        <!-- ĐỒNG HỒ VIỆT NAM REALTIME -->
        <div class="clock-section">
            <div class="clock-header">
                <i class="fa-solid fa-clock"></i> Giờ Việt Nam (ICT)
            </div>
            <div class="digital-clock" id="vietnamClock">00:00:00</div>
            <div class="date-display" id="vietnamDate">Đang tải...</div>
        </div>

        <!-- NPOINT API INFORMATION -->
        <div class="api-card">
            <div class="api-title"><i class="fa-solid fa-bell"></i> THÔNG BÁO TỪ HỆ THỐNG</div>
            <div class="api-status-val" id="apiResponse">Đang đồng bộ dữ liệu...</div>
        </div>

    </div>

    <script>
        // API Endpoint Npoint của bạn
        const NPOINT_API_URL = 'https://api.npoint.io/db97bcdc9bb0181fe3ee';

        // 1. TỰ ĐỘNG LẤY DỮ LIỆU TỪ NPOINT
        async function checkBanwaveAPI() {
            try {
                const response = await fetch(NPOINT_API_URL);
                const data = await response.json();

                if (data.banwave_status) {
                    document.getElementById('banwaveStatusText').textContent = "BANWAVE STATUS: " + data.banwave_status;
                }
                if (data.announcement) {
                    document.getElementById('apiResponse').textContent = data.announcement;
                }
            } catch (error) {
                document.getElementById('apiResponse').textContent = "Lỗi kết nối tới Npoint!";
            }
        }

        // Lấy dữ liệu ngay lập tức và lập lại mỗi 5s
        checkBanwaveAPI();
        setInterval(checkBanwaveAPI, 5000);

        // 2. ĐỒNG HỒ VIỆT NAM REALTIME 60FPS
        function updateVietnamTime() {
            const now = new Date();
            const optionsDate = { timeZone: 'Asia/Ho_Chi_Minh', weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
            const optionsTime = { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };

            const dateStr = now.toLocaleDateString('vi-VN', optionsDate);
            const timeStr = now.toLocaleTimeString('en-GB', optionsTime);

            document.getElementById('vietnamClock').textContent = timeStr;
            document.getElementById('vietnamDate').textContent = dateStr;
            
            requestAnimationFrame(updateVietnamTime);
        }
        requestAnimationFrame(updateVietnamTime);

        // 3. CANVAS HẠT NỀN GPU ACCELERATED
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.8;
                this.speedY = Math.random() * -0.5 - 0.2;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0 || this.x < 0 || this.x > width) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(52, 211, 153, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
